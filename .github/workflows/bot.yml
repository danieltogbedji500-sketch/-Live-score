name: Football LiveScore Bot
on:
  schedule: [{cron: '*/15 * * * *'}]
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - run: pip install requests playwright && playwright install chromium
      - run: python bot.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add state.json
          git commit -m "update state" || echo "no change"
          git push
